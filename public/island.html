<html>
  <head>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-entity
        laser-controls="hand: right"
        raycaster="objects: .clickable"
      ></a-entity>
      <a-entity
        laser-controls="hand: left"
        raycaster="objects: .clickable"
      ></a-entity>

      <a-entity
        hand-tracking-controls="hand: left"
        raycaster="objects: .clickable"
      ></a-entity>
      <a-entity
        hand-tracking-controls="hand: right"
        raycaster="objects: .clickable"
      ></a-entity>

      <a-entity
        hand-controls="hand: left; handModelStyle: lowPoly; color: #ffcccc"
      ></a-entity>
      <a-entity
        hand-controls="hand: right; handModelStyle: lowPoly; color: #ccccff"
      ></a-entity>

      <a-assets>
        <a-asset-item
          id="tree-island"
          src="/assets/models/goksin-model.glb"
        ></a-asset-item>

        <img id="stars-sky" src="/assets/images/starsmilky.jpg" />
      </a-assets>
      <a-entity id="cameraRig" position="0 0 0 ">
        <a-entity
          camera
          look-controls
          wasd-controls
          position="0 0 0"
          wasd-controls-enabled="true"
        >
          <a-entity
            cursor="fuse: true; fuseTimeout: 1000"
            material="color: white; shader: flat"
            position="0 0 -1"
            geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
            material="color: black; shader: flat"
          ></a-entity>
        </a-entity>
      </a-entity>

      <a-entity
        light="type: ambient; color: #fff7d9; intensity: 2"
        position="5 3 0"
      ></a-entity>

      <a-sky
        src="#stars-sky"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 200000; easing: linear"
      ></a-sky>

      <!-- Island model  -->
      <a-entity
        id="tree-island-entity"
        position="0 0 -3"
        visible="true"
        gltf-model="#tree-island"
        scale="1 1 1"
      >
        <a-sphere
          radius="1.5"
          color="#fff"
          opacity="0.001"
          class="clickable"
        ></a-sphere>
      </a-entity>
    </a-scene>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const backButton = document.querySelector("#backToScene1");
        if (backButton) {
          backButton.addEventListener("click", function () {
            window.location.href = "scene1.html"; // Go back to first scene
          });
        } else {
          console.warn("backToScene1 button not found");
        }
      });
    </script>
  </body>
</html>
